# Publish the web app to GitHub Pages.
#
# Inert until Pages is switched on for the repository:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
# Until then this workflow builds and uploads, and deployment is skipped.
#
# The app is entirely static — no server, no API, no upload — so any static
# host works. Netlify and Cloudflare Pages need only: build `npm run build`,
# publish `apps/web/dist`.

name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
