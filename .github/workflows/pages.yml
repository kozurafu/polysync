# Publish the web app to GitHub Pages.
#
# ONE-TIME SETUP, and it cannot be automated: a repository owner has to turn
# Pages on by hand at
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
# The workflow's GITHUB_TOKEN cannot do it — `actions/configure-pages` with
# `enablement: true` returns "Resource not accessible by integration" no matter
# what `permissions:` grants, because creating a Pages site needs admin rights
# a workflow token is never given. Tried, and it fails the build, so it is not
# used here. Until Pages is on, the build and artifact upload still succeed and
# only the deploy step fails.
#
# `actions/configure-pages` is deliberately absent for a second reason: its job
# is to hand a base URL to frameworks that need one at build time, and this app
# does not — vite.config.ts sets `base: './'` so every asset and worker URL
# resolves relative to the page. That is what makes the site work from a project
# subpath (https://<owner>.github.io/<repo>/) as well as from a domain root, and
# it is tested rather than assumed:
#   npm run smoke -- ./sample-shoot --base=/polysync
#
# The app is entirely static — no server, no API, no upload — so any static
# host works. Netlify and Cloudflare Pages need only: build `npm run build`,
# publish `apps/web/dist`.

name: Deploy web app

# Build on any branch so a broken build is caught early, but only deploy from
# the repository's default branch. Written as a job condition rather than a
# branch filter because this repository's default branch is not called `main`,
# and GitHub Pages refuses deployments from anything but the default branch.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
